[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["etl/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B904"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["pindah_etl"]
known-third-party = ["odoo"]

[tool.pytest.ini_options]
testpaths = ["etl/tests"]

[tool.ruff.lint.per-file-ignores]
# Skrip odoo shell: `env` disediakan oleh shell Odoo.
"scripts/*.py" = ["F821"]
# Konvensi Odoo: __init__ hanya mengimpor submodul, manifest berupa dict telanjang.
"__init__.py" = ["F401"]
"__manifest__.py" = ["B018"]
